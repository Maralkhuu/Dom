<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]"
  >
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65"
          >The everyday collection / 03</span
        >
      </header>

      <div class="flex flex-1 items-center flex-col justify-center py-10">
        <div class="w-[1240px] h-[104px] flex justify-between">
          <div class="w-[620px] h-[65px] flex gap-[12px] flex-col">
            <div class="text-[30px] text-[#F4F4F5]">Color palettes.</div>
            <div class="text-[14px] text-[#A1A1AA]">
              Generated shades with Tailwind color names. Click a shade to copy
              its HEX background color.
            </div>
          </div>
          <div
            class="w-[186px] h-[48px] flex gap-[8px] rounded-[12px] bg-[#D9F99D] items-center justify-center"
          >
            <button
              id="generate"
              type="button"
              class="inline-flex h-12 shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl bg-lime-200 px-5 py-3 text-sm font-semibold text-zinc-950 transition hover:bg-lime-100 active:scale-[0.98]"
            >
              <svg
                fill="none"
                class="size-4"
                stroke-width="2"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 7v5h-5M4 17v-5h5" />
                <path
                  d="M6.1 7a7 7 0 0 1 11.6-1L20 12M4 12l2.3 6A7 7 0 0 0 17.9 17"
                />
              </svg>
              Shuffle palettes
            </button>
          </div>
        </div>
        <div class="w-[1240px] h-[55px] justify-between items-center flex">
          <p class="h-[15px] text-[12px] text-[#A1A1AA]">
            100 → 950 · LIGHT TO DARK
          </p>
          <p id="status" class="h-[15px] text-[12px] text-[#A1A1AA]">
            Ready to explore.
          </p>
        </div>
        <div id="colors" class="w-[1240px] h-[956px] gap-7 flex flex-col">
          <div class="w-[1240px] h-[136px] gap-3 flex flex-col">
            <p class="text-[14px] text-[#E4E4E7]">Red</p>
            <div class="w-[1240px] h-[107px] gap-3 flex">
              <div class="w-[113.2px] h-[107px]">
                <div
                  class="w-[113.2px] h-[64px] rounded-[12px] bg-[#FDE3E3]"
                ></div>
                <div
                  class="flex items-center justify-center gap-1 pt-2 pb-1 flex-col"
                >
                  <p class="w-[22px] h-[15px] text-[12px] text-[#D4D4D8]">
                    100
                  </p>
                  <p class="w-[38px] h-[12px] text-[9px] text-[#A1A1AA]">
                    #FDE3E3
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
