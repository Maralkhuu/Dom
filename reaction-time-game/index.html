<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>
  <body
    class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65"
          >The everyday collection / 06</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="w-[576px] h-[575px] rounded-[24px] border p-8 bg-[#18181B] border-[#27272A]"
        >
          <p class="w-[159px] h-[29px] text-[24px] text-[#F4F4F5]">
            Reaction time
          </p>
          <p class="w-[313px] h-[24px] text-[14px] text-[#A1A1AA] mt-2">
            Wait for green, then click as quickly as you can.
          </p>
          <div
            class="w-[512px] h-[256px] rounded-[16px] flex gap-3 bg-[#27272A] mt-6 flex-col justify-center items-center"
          >
            <div>
              <div
                class="flex size-[46px] items-center justify-center bg-[#29292B]"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="60"
                  height="60"
                  viewBox="0 0 60 60"
                  fill="none"
                  stroke="#F5F5F5"
                  stroke-width="2.8"
                >
                  <circle cx="30" cy="30" r="27" />
                  <circle cx="30" cy="30" r="17" />
                  <circle cx="30" cy="30" r="6" fill="#F5F5F5" stroke="none" />
                </svg>
              </div>
            </div>
            <p class="h-[29px] text-[24px] text-[#F4F4F5]">Ready when you are</p>
            <p class="h-[17px] text-[14px] text-[#F4F4F5]">Click to start</p>
          </div>
          <div class="w-[512px] h-[84px] flex gap-3 mt-6">
            <div
              class="w-[250px] h-[84px] rounded-[12px] flex gap-1 flex-col bg-[#27272A] justify-center items-center"
            >
              <div class="w-[24px] h-[29px] text-[24px] text-[#D9F99D]">—</div>
              <div class="w-[73px] h-[15px] text-[12px] text-[#A1A1AA]">
                Last attempt
              </div>
            </div>
            <div
              class="w-[250px] h-[84px] rounded-[12px] flex gap-1 flex-col bg-[#27272A] justify-center items-center"
            >
              <div class="w-[24px] h-[29px] text-[24px] text-[#D9F99D]">—</div>
              <div class="w-h-[15px] text-[12px] text-[#A1A1AA]">
                Best this session
              </div>
            </div>
          </div>
          <p
            class="w-[512px] h-[40px] text-[12px] text-[#A1A1AA] text-center mt-5"
          >
            Click the panel, or focus it and press Space or Enter. Clicking
            before green ends the attempt.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
